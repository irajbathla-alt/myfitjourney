<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center;padding:18px}.panel{width:100%;max-width:440px;padding:28px 22px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:#0d0d0d;box-shadow:0 30px 90px rgba(0,0,0,.65)}.message{font-size:22px;font-weight:700;margin-bottom:10px}.sub{font-size:13px;line-height:1.6;color:rgba(255,255,255,.5)}.btn{display:inline-flex;margin-top:18px;padding:12px 18px;border-radius:999px;background:#00D97E;color:#000;font-weight:800;text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:1px}.btn.secondary{background:#fff;margin-left:8px}.small{margin-top:14px;font-size:11px;color:rgba(255,255,255,.28);word-break:break-word}
</style>
</head>
<body>
<div class="panel">
  <div class="message" id="message">Checking Membership...</div>
  <div class="sub" id="sub">Please wait while we verify your workout access.</div>
  <div id="actions"></div>
  <div class="small" id="debug"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCTQDlsZNhZ-I6CvlNgZDPgpJJYlYto6Rk",
  authDomain: "jalandhar-fitness-club.firebaseapp.com",
  projectId: "jalandhar-fitness-club",
  storageBucket: "jalandhar-fitness-club.firebasestorage.app",
  messagingSenderId: "899365845803",
  appId: "1:899365845803:web:a75a331462df8b017f236e"
};

initializeApp(firebaseConfig);
const auth = getAuth();
const CSV_URL = "https://docs.google.com/spreadsheets/d/1lXYKjtW2BzFEuIouRl04O8AT8zyiUaz3QwBHxsDwFqk/export?format=csv";

function setScreen(title, subtitle, buttons = "") {
  document.getElementById("message").textContent = title;
  document.getElementById("sub").textContent = subtitle || "";
  document.getElementById("actions").innerHTML = buttons;
}

function parseCsvLine(line) {
  const values = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    const next = line[i + 1];
    if (ch === '"') {
      if (inQuotes && next === '"') { current += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      values.push(current.trim());
      current = "";
    } else current += ch;
  }
  values.push(current.trim());
  return values;
}

async function getMemberData(email) {
  const response = await fetch(CSV_URL, { cache: "no-store" });
  if (!response.ok) throw new Error("Google Sheet could not be reached.");
  const text = await response.text();
  const lines = text.split(/\r?\n/).filter(r => r.trim() !== "");
  if (!lines.length) return null;

  const headers = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
  const emailIndex = headers.indexOf("email");
  const programIndex = headers.indexOf("program");
  const expiryIndex = headers.indexOf("expiry");
  const statusIndex = headers.indexOf("status");

  const fallback = emailIndex === -1;
  const target = email.trim().toLowerCase();

  for (let i = fallback ? 0 : 1; i < lines.length; i++) {
    const parts = parseCsvLine(lines[i]);
    const sheetEmail = fallback ? parts[0] : parts[emailIndex];
    if (sheetEmail && sheetEmail.trim().toLowerCase() === target) {
      return {
        program: (fallback ? parts[1] : parts[programIndex] || "").trim().toLowerCase(),
        expiry: (fallback ? parts[2] : parts[expiryIndex] || "").trim(),
        status: (fallback ? parts[3] : parts[statusIndex] || "").trim().toLowerCase()
      };
    }
  }
  return null;
}

function getProgramRoute(program) {
  const p = (program || "").toLowerCase().trim();
  if (!p) return null;
  if (p === "shred" || p.includes("shred") || p.includes("4 weeks") || p.includes("4 week")) return "shred.html";
  if (p === "strength" || p.includes("strength") || p.includes("builder")) return "strength.html";
  if (p === "bikini" || p.includes("bikini")) return "bikini.html";
  if (p === "p4" || p.includes("p4")) return "p4.html";
  if (p === "p5" || p.includes("p5")) return "p5.html";
  return null;
}

function isExpired(expiry) {
  if (!expiry) return false;
  const parsed = new Date(expiry);
  if (Number.isNaN(parsed.getTime())) return false;
  parsed.setHours(23,59,59,999);
  return new Date() > parsed;
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  document.getElementById("debug").textContent = user.email || "";

  try {
    const data = await getMemberData(user.email || "");

    if (!data) {
      setScreen(
        "Pending Approval",
        "Your login works, but this email was not found in the membership Sheet yet.",
        '<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Subscribe</a><a class="btn secondary" href="login.html">Back</a>'
      );
      return;
    }

    if (data.status !== "active") {
      setScreen(
        "Subscription Required",
        "Your account was found, but status is not active yet. Current status: " + (data.status || "blank"),
        '<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Subscribe</a><a class="btn secondary" href="login.html">Back</a>'
      );
      return;
    }

    if (isExpired(data.expiry)) {
      setScreen(
        "Membership Expired",
        "Your access expired on " + data.expiry + ". Please renew to continue training.",
        '<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Renew</a><a class="btn secondary" href="login.html">Back</a>'
      );
      return;
    }

    const route = getProgramRoute(data.program);
    if (!route) {
      setScreen(
        "No Program Assigned",
        "Your status is active, but the program value in the Sheet is not recognized: " + (data.program || "blank"),
        '<a class="btn secondary" href="login.html">Back</a>'
      );
      return;
    }

    window.location.href = route;
  } catch (error) {
    setScreen(
      "Unable to Verify Membership",
      error.message || "Please check your Google Sheet access and try again.",
      '<a class="btn secondary" href="login.html">Back to Login</a>'
    );
    console.error(error);
  }
});
</script>
</body>
</html>
