<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center;padding:18px}.panel{width:100%;max-width:440px;padding:28px 22px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:#0d0d0d;box-shadow:0 30px 90px rgba(0,0,0,.65)}.message{font-size:22px;font-weight:700;margin-bottom:10px}.sub{font-size:13px;line-height:1.6;color:rgba(255,255,255,.5)}.btn{display:inline-flex;margin-top:18px;padding:12px 18px;border-radius:999px;background:#00D97E;color:#000;font-weight:800;text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:1px}.btn.secondary{background:#fff;margin-left:8px}.small{margin-top:14px;font-size:11px;color:rgba(255,255,255,.28);word-break:break-word}
</style>
</head>
<body>
<div class="panel">
  <div class="message" id="message">Checking Membership...</div>
  <div class="sub" id="sub">Please wait while we verify your workout access.</div>
  <div id="actions"></div>
  <div class="small" id="debug"></div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwt1QBvLAf1yWfOMBEeq1b1YpEM6D97crZ5UcTU-x6ncd0l6rfX7agNG8N9OpwymhQ/exec";
const SECRET = "JFC2026PRIVATEKEY";
function setScreen(title, subtitle, buttons = "") { document.getElementById("message").textContent = title; document.getElementById("sub").textContent = subtitle || ""; document.getElementById("actions").innerHTML = buttons; }
function loginButtons(){return '<a class="btn secondary" href="login.html">Back to Login</a>';}
async function getMemberData(email){const callbackName="mfjVerifyCb_"+Date.now()+"_"+Math.floor(Math.random()*1000);return new Promise((resolve,reject)=>{const script=document.createElement("script");const timeout=window.setTimeout(()=>{cleanup();reject(new Error("Member API timeout."));},8000);const cleanup=()=>{window.clearTimeout(timeout);if(window[callbackName])delete window[callbackName];if(script.parentNode)script.parentNode.removeChild(script);};window[callbackName]=(data)=>{cleanup();if(!data){reject(new Error("Invalid API response."));return;}if(!data.ok){const msg=String(data.message||"").toLowerCase();if(msg.includes("not found")){resolve(null);return;}reject(new Error(data.message||"Unable to verify membership."));return;}if(!data.member){resolve(null);return;}resolve({program:String(data.member.program||"").trim().toLowerCase(),expiry:String(data.member.expiry||"").trim(),status:String(data.member.status||"").trim().toLowerCase()});};script.onerror=()=>{cleanup();reject(new Error("Member API could not be reached."));};const q=new URLSearchParams({action:"verify",email:email,secret:SECRET,callback:callbackName});script.src=SCRIPT_URL+"?"+q.toString();document.body.appendChild(script);});}
function getProgramRoute(program){const p=(program||"").toLowerCase().trim();if(!p)return null;if(p==="shred"||p.includes("shred")||p.includes("4 weeks")||p.includes("4 week"))return "shred.html";if(p==="strength"||p.includes("strength")||p.includes("builder"))return "strength.html";if(p==="bikini"||p.includes("bikini"))return "bikini.html";if(p==="p4"||p.includes("p4"))return "p4.html";if(p==="p5"||p.includes("p5"))return "p5.html";return null;}
function isExpired(expiry){if(!expiry)return false;const parsed=new Date(expiry);if(Number.isNaN(parsed.getTime()))return false;parsed.setHours(23,59,59,999);return new Date()>parsed;}
async function verify(){const email=(sessionStorage.getItem('mfj_last_email')||localStorage.getItem('mfj_last_email')||'').trim().toLowerCase();if(!email){setScreen("Login Email Not Found","Please sign in again. The dashboard could not read your saved login email.",loginButtons());return;}document.getElementById("debug").textContent=email;try{const data=await getMemberData(email);if(!data){setScreen("Pending Approval","This email was not found in the membership Sheet yet: "+email,'<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Subscribe</a>'+loginButtons());return;}if(data.status!=="active"){setScreen("Subscription Required","Your account was found, but status is not active yet. Current status: "+(data.status||"blank"),'<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Subscribe</a>'+loginButtons());return;}if(isExpired(data.expiry)){setScreen("Membership Expired","Your access expired on "+data.expiry+". Please renew to continue training.",'<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Renew</a>'+loginButtons());return;}const route=getProgramRoute(data.program);if(!route){setScreen("No Program Assigned","Your status is active, but the program value in the Sheet is not recognized: "+(data.program||"blank"),loginButtons());return;}window.location.href=route;}catch(error){setScreen("Unable to Verify Membership",error.message||"Please check your Google Sheet access and try again.",loginButtons());console.error(error);}}
verify();
</script>
</body>
</html>
