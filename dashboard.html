<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0%,rgba(0,217,126,.075),transparent 30%),radial-gradient(circle at 50% 100%,rgba(255,255,255,.045),transparent 34%),#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center;padding:18px;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,black,transparent 72%);opacity:.35}
.panel{width:100%;max-width:460px;padding:34px 26px 30px;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:linear-gradient(155deg,rgba(20,20,20,.98),rgba(7,7,7,.98));box-shadow:0 45px 120px rgba(0,0,0,.82),0 0 55px rgba(0,217,126,.045),inset 0 1px 0 rgba(255,255,255,.055);position:relative;overflow:hidden;animation:panelIn .45s cubic-bezier(.16,1,.3,1) both}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.panel::before{content:"";position:absolute;inset:-1px;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 30%,rgba(0,217,126,.08),transparent 72%);opacity:.5;pointer-events:none}
.portal-label{position:relative;z-index:1;display:inline-flex;margin:0 auto 13px;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.028);color:rgba(255,255,255,.38);font-size:8px;font-weight:800;letter-spacing:2.1px;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.status-icon{position:relative;z-index:1;width:38px;height:38px;margin:0 auto 15px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));box-shadow:0 0 35px rgba(0,217,126,.095),inset 0 1px 0 rgba(255,255,255,.08)}
.status-icon::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:999px;background:#00D97E;box-shadow:0 0 18px rgba(0,217,126,.8);transform:translate(-50%,-50%);animation:dotPulse 1.45s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.86)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}}
.message{position:relative;z-index:1;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:800;line-height:1.16;letter-spacing:1.15px;text-transform:uppercase;margin-bottom:12px;text-shadow:0 10px 36px rgba(255,255,255,.055)}
.message::after{content:"";display:block;width:72px;height:2px;margin:16px auto 0;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(0,217,126,.3),#00D97E,rgba(0,217,126,.3),transparent);box-shadow:0 0 18px rgba(0,217,126,.28);animation:mfjPulse 1.45s cubic-bezier(.4,0,.2,1) infinite}
@keyframes mfjPulse{0%,100%{opacity:.32;transform:scaleX(.68)}50%{opacity:1;transform:scaleX(1)}}
.sub{position:relative;z-index:1;max-width:340px;margin:0 auto;font-size:13px;line-height:1.75;color:rgba(255,255,255,.56)}
.sub::after{content:"Secure check in progress";display:inline-flex;margin-top:18px;padding:6px 11px;border-radius:999px;border:1px solid rgba(0,217,126,.18);background:rgba(0,217,126,.045);color:rgba(0,217,126,.72);font-size:8px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}
#actions{position:relative;z-index:1}.btn{display:inline-flex;margin-top:18px;padding:12px 17px;border-radius:999px;background:#00D97E;color:#000;font-weight:800;text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:1.25px;box-shadow:0 14px 34px rgba(0,217,126,.14);transition:transform .22s ease,box-shadow .22s ease,opacity .22s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(0,217,126,.22)}.btn.secondary{background:#fff;margin-left:8px;box-shadow:0 14px 34px rgba(255,255,255,.08)}.small{position:relative;z-index:1;margin-top:18px;font-size:10px;letter-spacing:.4px;color:rgba(255,255,255,.22);word-break:break-word}
@media (max-width:380px){.panel{padding:30px 20px 26px}.message{font-size:21px}.btn.secondary{margin-left:0;margin-top:10px}}
</style>
</head>
<body>
<div class="panel">
  <div class="portal-label">Member Portal</div>
  <div class="status-icon" aria-hidden="true"></div>
  <div class="message" id="message">Verifying Member Access</div>
  <div class="sub" id="sub">Securely checking your membership status, assigned program, and account access.</div>
  <div id="actions"></div>
  <div class="small" id="debug"></div>
</div>
<script src="shared-config.js"></script>
<script src="shared-api.js"></script>
<script>
function setScreen(title, subtitle, buttons = "") { document.getElementById("message").textContent = title; document.getElementById("sub").textContent = subtitle || ""; document.getElementById("actions").innerHTML = buttons; }
function loginButtons(){return '<a class="btn secondary" href="login.html">Back to Login</a>';}
async function getMemberData(email){const data=await window.mfjCallApi("verify",{email:email},8000);if(!data){throw new Error("Invalid API response.");}if(!data.ok){const msg=String(data.message||"").toLowerCase();if(msg.includes("not found")){return null;}throw new Error(data.message||"Unable to verify membership.");}if(!data.member){return null;}return{program:String(data.member.program||"").trim().toLowerCase(),expiry:String(data.member.expiry||"").trim(),status:String(data.member.status||"").trim().toLowerCase()};}
function getCachedMember(email){try{const raw=localStorage.getItem("mfj_cached_member");if(!raw)return null;const member=JSON.parse(raw);if(!member||String(member.email||"").trim().toLowerCase()!==email)return null;return{program:String(member.program||"").trim().toLowerCase(),expiry:String(member.expiry||"").trim(),status:String(member.status||"").trim().toLowerCase()};}catch(_err){return null;}}
function normalizeProgramId(value){return String(value||"").trim().toLowerCase();}
async function loadAvailablePrograms(){
  let remote=[];
  try{
    const res=await window.mfjCallApi("listPrograms",{},8000);
    if(res&&res.ok&&Array.isArray(res.programs)) remote=res.programs;
  }catch(_e){}
  const localAll=window.getMfjPrograms?window.getMfjPrograms():(Array.isArray(window.MFJ_PROGRAMS)?window.MFJ_PROGRAMS:[]);
  return [...localAll,...remote].filter((p,i,a)=>p&&p.id&&a.findIndex(x=>normalizeProgramId(x.id)===normalizeProgramId(p.id))===i);
}
async function getProgramRoute(program){
  const p=normalizeProgramId(program);
  if(!p)return null;
  const programs=await loadAvailablePrograms();
  const found=programs.find(item=>{
    const id=normalizeProgramId(item.id);
    const name=normalizeProgramId(item.name);
    return id===p || name===p || p.includes(id) || (name&&p.includes(name));
  });
  if(found&&found.file)return found.file;
  if(p==="shred"||p.includes("shred")||p.includes("4 weeks")||p.includes("4 week"))return "shred.html";
  if(p==="strength"||p.includes("strength")||p.includes("builder"))return "strength.html";
  if(p==="bikini"||p.includes("bikini"))return "bikini.html";
  if(/^p\d+$/.test(p))return p+".html";
  return null;
}
function isExpired(expiry){if(!expiry)return false;const parsed=new Date(expiry);if(Number.isNaN(parsed.getTime()))return false;parsed.setHours(23,59,59,999);return new Date()>parsed;}
async function routeExists(route){try{const r=await fetch(route,{method:'HEAD',cache:'no-store'});return r.ok;}catch(_e){return true;}}
async function verify(){const email=(sessionStorage.getItem('mfj_last_email')||localStorage.getItem('mfj_last_email')||'').trim().toLowerCase();if(!email){setScreen("Login Email Not Found","Please sign in again. The dashboard could not read your saved login email.",loginButtons());return;}document.getElementById("debug").textContent=email;try{const data=(await getMemberData(email))||getCachedMember(email);if(!data){setScreen("Pending Approval","This email was not found in the membership Sheet yet: "+email,'<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Subscribe</a>'+loginButtons());return;}if(data.status!=="active"){setScreen("Subscription Required","Your account was found, but status is not active yet. Current status: "+(data.status||"blank"),'<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Subscribe</a>'+loginButtons());return;}if(isExpired(data.expiry)){setScreen("Membership Expired","Your access expired on "+data.expiry+". Please renew to continue training.",'<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Renew</a>'+loginButtons());return;}const route=await getProgramRoute(data.program);if(!route){setScreen("No Program Assigned","Your status is active, but the program value in the Sheet is not recognized: "+(data.program||"blank"),loginButtons());return;}if(!(await routeExists(route))){setScreen("Program Page Missing","Your account is active for "+data.program+", but the program page was not found: "+route,loginButtons());return;}window.location.href=route;}catch(error){const cached=getCachedMember(email);if(cached&&cached.status==="active"){const route=await getProgramRoute(cached.program);if(route){window.location.href=route;return;}}setScreen("Unable to Verify Membership",error.message||"Please check your Google Sheet access and try again.",loginButtons());console.error(error);}}
verify();
</script>
</body>
</html>
