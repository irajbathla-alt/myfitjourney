<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center;padding:18px;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.01) 1px,transparent 1px);background-size:48px 48px;opacity:.18}
.panel{width:100%;max-width:465px;padding:28px 23px 25px;border:1px solid rgba(0,0,0,.11);border-radius:22px;background:#fff;box-shadow:0 10px 28px rgba(0,0,0,.08);position:relative;overflow:hidden;animation:panelIn .26s cubic-bezier(.16,1,.3,1) both}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
.panel::before{content:"";position:absolute;inset:-1px;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 38%,rgba(0,217,126,.04),transparent 75%);opacity:.3;pointer-events:none}
.portal-label{position:relative;z-index:1;display:inline-flex;margin:0 auto 10px;padding:4px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.12);background:rgba(0,0,0,.02);color:rgba(0,0,0,.45);font-size:7px;font-weight:800;letter-spacing:1.9px;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.status-icon{position:relative;z-index:1;width:32px;height:32px;margin:0 auto 12px;border-radius:12px;border:1px solid rgba(0,0,0,.12);background:linear-gradient(145deg,rgba(0,0,0,.04),rgba(0,0,0,.01));box-shadow:0 0 28px rgba(0,217,126,.085),inset 0 1px 0 rgba(255,255,255,.5)}
.status-icon::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:999px;background:#00D97E;box-shadow:0 0 16px rgba(0,217,126,.78);transform:translate(-50%,-50%);animation:dotPulse .95s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.88)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}}
.message{position:relative;z-index:1;font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:800;line-height:1.15;letter-spacing:1px;text-transform:uppercase;margin-bottom:9px;color:#000}
.message::after{content:"";display:block;width:62px;height:2px;margin:12px auto 0;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(0,217,126,.28),#00D97E,rgba(0,217,126,.28),transparent);box-shadow:0 0 15px rgba(0,217,126,.24);animation:mfjPulse .95s cubic-bezier(.4,0,.2,1) infinite}
@keyframes mfjPulse{0%,100%{opacity:.34;transform:scaleX(.7)}50%{opacity:1;transform:scaleX(1)}}
.sub{position:relative;z-index:1;max-width:none;margin:0 auto;font-size:11px;line-height:1.45;color:rgba(0,0,0,.65);white-space:nowrap}
.sub::after{content:"Secure check in progress";display:block;width:max-content;margin:12px auto 0;padding:5px 10px;border-radius:999px;border:1px solid rgba(0,217,126,.18);background:rgba(0,217,126,.04);color:rgba(0,217,126,.7);font-size:7px;font-weight:800;letter-spacing:1.45px;text-transform:uppercase;white-space:nowrap}
.panel.confirmed .status-icon::after{content:"✓";width:18px;height:18px;background:#00D97E;color:#000;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;animation:confirmPop .26s ease both;box-shadow:0 0 22px rgba(0,217,126,.75)}
.panel.confirmed .sub::after{content:"Opening your program";}
@keyframes confirmPop{from{transform:translate(-50%,-50%) scale(.6);opacity:.3}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#actions{position:relative;z-index:1}.btn{display:inline-flex;margin-top:16px;padding:11px 16px;border-radius:999px;background:#00D97E;color:#000;font-weight:800;text-decoration:none;font-size:11px;text-transform:uppercase;letter-spacing:1.15px;box-shadow:0 12px 30px rgba(0,217,126,.13);transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 15px 36px rgba(0,217,126,.2)}.btn.secondary{background:#fff;margin-left:8px;border:1px solid rgba(0,0,0,.12);box-shadow:0 12px 30px rgba(0,0,0,.07)}.small{position:relative;z-index:1;margin-top:14px;font-size:9px;letter-spacing:.35px;color:rgba(0,0,0,.45);word-break:break-word}
.dash-foot{position:relative;z-index:1;margin-top:14px;font-size:8px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(0,0,0,.35)}
@media (max-width:430px){.panel{max-width:100%;padding:26px 18px 23px}.message{font-size:18px}.sub{font-size:9.5px;letter-spacing:-.1px}.btn.secondary{margin-left:0;margin-top:9px}}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="portal-label">Member Portal</div>
  <div class="status-icon" aria-hidden="true"></div>
  <div class="message" id="message">Verifying Access</div>
  <div class="sub" id="sub">Checking your membership, assigned program, and account access.</div>
  <div id="actions"></div>
  <div class="small" id="debug"></div>
  <div class="dash-foot">My Fit Journey</div>
</div>
<script>window.MFJ_DISABLE_POLISH = true;</script>
<script src="shared-config.js"></script>
<script src="shared-api.js"></script>
<script>
function setScreen(title, subtitle, buttons = "") { document.getElementById("message").textContent = title; document.getElementById("sub").textContent = subtitle || ""; document.getElementById("actions").innerHTML = buttons; }
function loginButtons(){return '<a class="btn secondary" href="login.html">Back to Login</a>';}
async function getMemberData(email){const data=await window.mfjCallApi("verify",{email:email},8000);if(!data){throw new Error("Invalid API response.");}if(!data.ok){const msg=String(data.message||"").toLowerCase();if(msg.includes("not found")){return null;}throw new Error(data.message||"Unable to verify membership.");}if(!data.member){return null;}return{program:String(data.member.program||"").trim().toLowerCase(),expiry:String(data.member.expiry||"").trim(),status:String(data.member.status||"").trim().toLowerCase()};}
function getCachedMember(email){try{const raw=localStorage.getItem("mfj_cached_member");if(!raw)return null;const member=JSON.parse(raw);if(!member||String(member.email||"").trim().toLowerCase()!==email)return null;return{program:String(member.program||"").trim().toLowerCase(),expiry:String(member.expiry||"").trim(),status:String(member.status||"").trim().toLowerCase()};}catch(_err){return null;}}
function normalizeProgramId(value){return String(value||"").trim().toLowerCase();}
async function loadAvailablePrograms(){
  let remote=[];
  try{
    const res=await window.mfjCallApi("listPrograms",{},8000);
    if(res&&res.ok&&Array.isArray(res.programs)) remote=res.programs;
  }catch(_e){}
  const localAll=window.getMfjPrograms?window.getMfjPrograms():(Array.isArray(window.MFJ_PROGRAMS)?window.MFJ_PROGRAMS:[]);
  return [...localAll,...remote].filter((p,i,a)=>p&&p.id&&a.findIndex(x=>normalizeProgramId(x.id)===normalizeProgramId(p.id))===i);
}
async function getProgramRoute(program){
  const p=normalizeProgramId(program);
  if(!p)return null;
  const programs=await loadAvailablePrograms();
  const found=programs.find(item=>{
    const id=normalizeProgramId(item.id);
    const name=normalizeProgramId(item.name);
    return id===p || name===p || p.includes(id) || (name&&p.includes(name));
  });
  if(found&&found.file)return found.file;
  if(p==="shred"||p.includes("shred")||p.includes("4 weeks")||p.includes("4 week"))return "shred.html";
  if(p==="strength"||p.includes("strength")||p.includes("builder"))return "strength.html";
  if(p==="bikini"||p.includes("bikini"))return "bikini.html";
  if(/^p\d+$/.test(p))return p+".html";
  return null;
}
function isExpired(expiry){if(!expiry)return false;const parsed=new Date(expiry);if(Number.isNaN(parsed.getTime()))return false;parsed.setHours(23,59,59,999);return new Date()>parsed;}
async function routeExists(route){try{const r=await fetch(route,{method:'HEAD',cache:'no-store'});return r.ok;}catch(_e){return true;}}
function openProgram(route){document.getElementById('panel').classList.add('confirmed');setScreen('Access Confirmed','Your program is ready.');setTimeout(()=>{window.location.href=route;},450);}
async function verify(){const email=(sessionStorage.getItem('mfj_last_email')||localStorage.getItem('mfj_last_email')||'').trim().toLowerCase();if(!email){setScreen("Login Email Not Found","Please sign in again. The dashboard could not read your saved login email.",loginButtons());return;}document.getElementById("debug").textContent=email;const cached=getCachedMember(email);if(cached&&cached.status==="active"&&!isExpired(cached.expiry)){const cachedRoute=await getProgramRoute(cached.program);if(cachedRoute){openProgram(cachedRoute);return;}}try{const data=(await getMemberData(email))||cached;if(!data){setScreen("Pending Approval","This email was not found in the membership Sheet yet: "+email,'<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Subscribe</a>'+loginButtons());return;}if(data.status!=="active"){setScreen("Subscription Required","Your account was found, but status is not active yet. Current status: "+(data.status||"blank"),'<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Subscribe</a>'+loginButtons());return;}if(isExpired(data.expiry)){setScreen("Membership Expired","Your access expired on "+data.expiry+". Please renew to continue training.",'<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Renew</a>'+loginButtons());return;}const route=await getProgramRoute(data.program);if(!route){setScreen("No Program Assigned","Your status is active, but the program value in the Sheet is not recognized: "+(data.program||"blank"),loginButtons());return;}if(!(await routeExists(route))){setScreen("Program Page Missing","Your account is active for "+data.program+", but the program page was not found: "+route,loginButtons());return;}openProgram(route);}catch(error){if(cached&&cached.status==="active"){const route=await getProgramRoute(cached.program);if(route){openProgram(route);return;}}setScreen("Unable to Verify Membership",error.message||"Please check your Google Sheet access and try again.",loginButtons());console.error(error);}}
verify();
</script>
</body>
</html>
