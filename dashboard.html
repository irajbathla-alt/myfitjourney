<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Dashboard — My Fit Journey</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center;padding:18px}.card{width:100%;max-width:430px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:#0d0d0d;padding:30px 24px;box-shadow:0 40px 100px rgba(0,0,0,.75)}.message{font-size:22px;font-weight:700;margin-bottom:10px}.sub{font-size:13px;color:rgba(255,255,255,.45);line-height:1.6}.btn{display:inline-flex;margin-top:18px;padding:13px 18px;border-radius:12px;background:#00D97E;color:#000;text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:12px}.ghost{background:#fff;margin-left:8px}.small{margin-top:14px;font-size:11px;color:rgba(255,255,255,.28)}
</style>
</head>
<body>
<div class="card">
  <div class="message" id="message">Checking Membership...</div>
  <div class="sub" id="sub">Please wait while we verify your access from Google Sheets.</div>
  <div id="actions"></div>
  <div class="small" id="emailLine"></div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPYoPFV6Ez73oq38hebKGFYEEqyOhCd8gBxwlChwJUoGWOc2HiEFurNUX2KXidjz0/exec";
const PROGRAM_ROUTES = {shred:'shred.html',strength:'strength.html',bikini:'bikini.html',p4:'p4.html',p5:'p5.html'};
function setScreen(title, text, buttons=''){document.getElementById('message').textContent=title;document.getElementById('sub').textContent=text||'';document.getElementById('actions').innerHTML=buttons;}
async function api(payload){const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});return await res.json();}
function logout(){localStorage.removeItem('mfj_member_email');localStorage.removeItem('mfj_member_token');localStorage.removeItem('mfj_member_login_at');window.location.href='login.html';}
async function verify(){const email=(localStorage.getItem('mfj_member_email')||'').trim().toLowerCase();const token=localStorage.getItem('mfj_member_token')||'';if(!email||!token){window.location.href='login.html';return;}document.getElementById('emailLine').textContent=email;try{const data=await api({action:'verify',email,token});if(!data.ok){logout();return;}const member=data.member||{};const status=(member.status||'').toLowerCase();const program=(member.program||'').toLowerCase();const expiry=member.expiry||'';if(status!=='active'){setScreen('Subscription Required','Your account exists, but your membership is not active yet. Please subscribe using the same email address.',`<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Subscribe — $2 / Week</a><a class="btn ghost" href="#" onclick="logout()">Logout</a>`);return;}if(expiry){const expiryDate=new Date(expiry);expiryDate.setHours(23,59,59,999);if(!Number.isNaN(expiryDate.getTime())&&new Date()>expiryDate){setScreen('Membership Expired','Please renew your membership to continue training.',`<a class="btn" href="https://square.link/u/E4LYxGUQ" target="_blank">Renew Access</a><a class="btn ghost" href="#" onclick="logout()">Logout</a>`);return;}}
const route=PROGRAM_ROUTES[program];if(route){window.location.href=route;return;}setScreen('No Program Assigned','Your account is active, but no program is assigned yet. Please contact support.',`<a class="btn ghost" href="#" onclick="logout()">Logout</a>`);}catch(err){setScreen('Unable to Verify','Please check your internet connection and try again.',`<a class="btn ghost" href="login.html">Back to Login</a>`);console.error(err);}}
verify();
</script>
</body>
</html>
