<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — My Fit Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;min-height:100vh}
:root{--b:rgba(255,255,255,0.09);--b2:rgba(255,255,255,0.18);--s:#0d0d0d;--s2:#161616;--m:rgba(255,255,255,0.35);--red:#e05555;--green:#00D97E}
.card{width:90%;max-width:390px;background:var(--s);border:1px solid var(--b);border-radius:20px;padding:36px 28px;box-shadow:0 40px 100px rgba(0,0,0,0.8);animation:up 0.55s cubic-bezier(0.16,1,0.3,1) both}
@keyframes up{0%{opacity:0;transform:translateY(24px) scale(0.98)}100%{opacity:1;transform:none}}
.back{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--m);text-decoration:none;margin-bottom:22px;transition:color 0.2s}.back:hover{color:#fff}
.admin-link{float:right;font-size:11px;color:rgba(255,255,255,.35);text-decoration:none;margin-top:2px}
.admin-link:hover{color:#fff}
.logo{font-family:'Cinzel',serif;font-size:15px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;color:#fff;text-align:center;margin-bottom:4px}
.logo-sub{font-size:10px;color:var(--m);letter-spacing:1.5px;text-transform:uppercase;text-align:center;margin-bottom:26px}
.tabs{display:flex;background:var(--s2);border-radius:10px;padding:3px;margin-bottom:22px;border:1px solid var(--b)}
.tab{flex:1;padding:10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--m);transition:all 0.2s;border:none;background:transparent;font-family:'Inter',sans-serif}
.tab.active{background:#fff;color:#000;box-shadow:0 2px 8px rgba(0,0,0,0.4)}
.lbl{display:block;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--m);margin-bottom:7px}
input,select{width:100%;padding:13px 14px;margin-bottom:11px;background:var(--s2);border:1px solid var(--b);border-radius:10px;color:#fff;font-size:14px;font-family:'Inter',sans-serif;transition:border-color 0.2s,box-shadow 0.2s;outline:none}
select{padding:10px 14px;font-size:12px}
input:focus,select:focus{border-color:rgba(255,255,255,0.35);box-shadow:0 0 0 3px rgba(255,255,255,0.05)}
input::placeholder{color:rgba(255,255,255,0.18)}
option{background:#161616;color:#fff}.program-field{display:none}
.submit{width:100%;padding:14px;border-radius:11px;border:none;font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:1.5px;cursor:pointer;background:#fff;color:#000;transition:all 0.2s ease;margin-top:3px}
.submit:hover{background:rgba(255,255,255,0.88);transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,255,255,0.1)}
.submit:active{transform:translateY(0)}.submit:disabled{opacity:0.35;cursor:not-allowed;transform:none}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,0.2);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
#msg{min-height:18px;margin-top:11px;font-size:12px;text-align:center;border-radius:8px;transition:all 0.2s}#msg.error{color:var(--red);background:rgba(224,85,85,0.07);border:1px solid rgba(224,85,85,0.2);padding:9px 12px}
.success-wrap{display:none;text-align:center;padding:8px 0 4px;animation:up 0.5s cubic-bezier(0.16,1,0.3,1) both}.success-wrap.show{display:block}.success-icon{width:54px;height:54px;border-radius:50%;background:var(--green);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:22px;animation:popIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both}@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.success-title{font-family:'Cinzel',serif;font-weight:900;font-size:20px;letter-spacing:1px;color:#fff;margin-bottom:10px}.success-body{font-size:13px;color:rgba(255,255,255,0.45);line-height:1.75}.success-body strong{color:var(--green);font-weight:600;display:block;margin-top:8px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.sub-notice{margin-top:18px;padding:12px 14px;border:1px solid rgba(255,255,255,0.07);border-radius:10px;background:rgba(255,255,255,0.02);font-size:11px;color:rgba(255,255,255,0.3);line-height:1.7;text-align:center}.sub-notice a{color:var(--green);text-decoration:none;font-weight:600}.sub-notice a:hover{opacity:0.75}
.btn-subscribe-green{display:flex;align-items:center;justify-content:center;width:100%;margin-top:14px;padding:15px;border-radius:11px;border:none;background:var(--green);color:#000;font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;cursor:pointer;position:relative;overflow:hidden;transition:transform 0.25s,box-shadow 0.3s;animation:greenPulse 3s ease-in-out infinite}@keyframes greenPulse{0%,100%{box-shadow:0 4px 20px rgba(0,217,126,0.3)}50%{box-shadow:0 8px 36px rgba(0,217,126,0.55)}}.btn-subscribe-green::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent);transform:translateX(-100%);animation:btnShimmer 2.8s ease-in-out infinite}@keyframes btnShimmer{0%{transform:translateX(-100%)}55%,100%{transform:translateX(120%)}}.btn-subscribe-green:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,217,126,0.65)}
.admin{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--b)}
.admin input{margin-bottom:8px}
.admin-head{display:none;text-align:center;margin-bottom:14px}
.admin-head .t{font-family:'Cinzel',serif;font-size:18px;letter-spacing:1px}
.admin-head .s{font-size:11px;color:var(--m);margin-top:4px}
</style>
</head>
<body>
<div class="card">
<a class="back" href="index.html">&#8592; Back</a>
<a class="admin-link" href="login.html?admin=1">Admin Mode</a>
<div class="logo">My Fit Journey</div><div class="logo-sub">Member Portal</div>
<div class="tabs"><button class="tab active" id="t-in" onclick="sw('login')">Sign In</button><button class="tab" id="t-reg" onclick="sw('register')">Create Account</button></div>
<div class="admin-head" id="adminHead"><div class="t">Program Admin</div><div class="s">Add and publish programs</div></div>
<div id="form-area">
<label class="lbl">Email Address</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email">
<label class="lbl">Password</label><input type="password" id="pass" placeholder="Minimum 6 characters" autocomplete="current-password">
<div class="program-field" id="programField"><label class="lbl">Program</label><select id="program"></select></div>
<button class="submit" id="sub" onclick="go()">Sign In</button><div id="msg"></div>
<div class="admin" id="adminBox">
  <label class="lbl">Admin · Add Program</label>
  <input id="a-id" placeholder="Program id (example: p4)">
  <input id="a-name" placeholder="Program name">
  <input id="a-file" placeholder="File name (example: p4.html)">
  <button class="submit" type="button" onclick="addProgram()">Add Program</button>
</div>
</div>
<div class="success-wrap" id="success-wrap"><div class="success-icon">&#10003;</div><div class="success-title">Account Created Successfully</div><p class="success-body">Waiting for subscription confirmation.<br><strong>Access granted within 24 hours</strong></p><div class="sub-notice" style="margin-top:16px">A subscription is required to activate your account.</div><a href="https://square.link/u/E4LYxGUQ" target="_blank" class="btn-subscribe-green">Subscribe &mdash; $2 / Week</a></div>
</div>
<script src="shared-config.js"></script>
<script src="shared-api.js"></script>
<script>
let tab='login';
const programSelect = document.getElementById('program');
async function loadPrograms(){
  let remote = [];
  try{
    const res = await window.mfjCallApi("listPrograms",{},10000);
    if(res && res.ok && Array.isArray(res.programs)) remote = res.programs;
  }catch(_e){}
  const localAll = window.getMfjPrograms ? window.getMfjPrograms() : (Array.isArray(window.MFJ_PROGRAMS) ? window.MFJ_PROGRAMS : []);
  const all = [...localAll, ...remote].filter((p,i,a)=>p&&p.id&&a.findIndex(x=>x.id===p.id)===i);
  const checks = await Promise.all(all.map(async p=>{
    if(!p.file) return p;
    try{ const r=await fetch(p.file,{method:'HEAD'}); return r.ok ? p : null; }catch(_e){ return null; }
  }));
  const programs = checks.filter(Boolean);
  programSelect.innerHTML = programs.map((p,i)=>`<option value="${p.id}" ${i===0?'selected':''}>${p.name}</option>`).join('');
}
loadPrograms();
const isAdminMode = location.search.includes('admin=1');
document.getElementById('adminBox').style.display = isAdminMode ? 'block' : 'none';
if(isAdminMode){
  document.querySelector('.tabs').style.display='none';
  document.getElementById('programField').style.display='none';
  document.getElementById('sub').style.display='none';
  document.getElementById('email').style.display='none';
  document.getElementById('pass').style.display='none';
  document.querySelectorAll('.lbl')[0].style.display='none';
  document.querySelectorAll('.lbl')[1].style.display='none';
  document.getElementById('adminHead').style.display='block';
  document.querySelector('.logo-sub').textContent='Admin Console';
}
window.addProgram = async function(){
  const adminPass = window.prompt('Enter admin password to add program:','') || '';
  const id=document.getElementById('a-id').value.trim().toLowerCase();
  const name=document.getElementById('a-name').value.trim();
  const file=document.getElementById('a-file').value.trim();
  if(adminPass !== ['VFC','2026!'].join('')){ setMsg('Invalid admin password.','error'); return; }
  if(!id || !name || !file){ setMsg('Fill all admin fields.','error'); return; }
  try{
    const remoteAdd = await window.mfjCallApi("adminAddProgram",{password:adminPass,id,name,file},10000);
    if(remoteAdd && remoteAdd.ok){
      setMsg('Program added online successfully.','');
      setTimeout(()=>location.reload(),600);
      return;
    }
  }catch(_e){}
  let admin=[]; try{ admin=JSON.parse(localStorage.getItem(window.MFJ_PROGRAMS_KEY)||"[]"); }catch(_e){}
  admin=admin.filter(p=>p.id!==id);
  admin.push({id,name,sub:'Custom Program',body:'Added from admin tab.',pills:['Custom'],color:'#9ca3af',activeClass:'active-strength',btnClass:'prog-dl-strength',file});
  localStorage.setItem(window.MFJ_PROGRAMS_KEY,JSON.stringify(admin));
  setMsg('Added locally (backend not available).','');
  location.reload();
}
function setMsg(t,c){const el=document.getElementById('msg');el.textContent=t;el.className=c;}
function reset(){const btn=document.getElementById('sub');btn.disabled=false;btn.textContent=tab==='login'?'Sign In':'Create Account';}
function sw(t){tab=t;document.getElementById('t-in').classList.toggle('active',t==='login');document.getElementById('t-reg').classList.toggle('active',t==='register');document.getElementById('sub').textContent=t==='login'?'Sign In':'Create Account';document.getElementById('programField').style.display=t==='register'?'block':'none';setMsg('','');}
function go(){const e=document.getElementById('email').value.trim();const p=document.getElementById('pass').value.trim();if(!e||!p){setMsg('Please fill in both fields.','error');return;}if(p.length<6){setMsg('Password must be at least 6 characters.','error');return;}const btn=document.getElementById('sub');btn.disabled=true;btn.innerHTML='<span class="spin"></span>'+(tab==='login'?'Signing in\u2026':'Creating account\u2026');setMsg('','');if(tab==='login')window._fbSignIn(e,p);else window._fbRegister(e,p,document.getElementById('program').value);}
</script>
<script>
window._fbSignIn=async(e,p)=>{try{const data=await window.mfjCallApi("login",{email:e,password:p},10000);if(!data.ok){setMsg(data.message||"Incorrect email or password.","error");reset();return;}const normalizedEmail=e.toLowerCase();sessionStorage.setItem('mfj_last_email',normalizedEmail);localStorage.setItem('mfj_last_email',normalizedEmail);if(data.member){localStorage.setItem('mfj_cached_member',JSON.stringify({email:normalizedEmail,program:String(data.member.program||"").trim().toLowerCase(),expiry:String(data.member.expiry||"").trim(),status:String(data.member.status||"").trim().toLowerCase(),cachedAt:Date.now()}));}setTimeout(()=>{window.location.href='dashboard.html';},250);}catch(err){setMsg(err.message||'Unable to sign in right now.','error');reset();}};
window._fbRegister=async(e,p,program)=>{try{const selectedProgram=(program||'shred').trim().toLowerCase();const data=await window.mfjCallApi("register",{email:e,password:p,program:selectedProgram,selectedProgram:selectedProgram},10000);if(!data.ok){setMsg(data.message||'Unable to create account.','error');reset();return;}sessionStorage.setItem('mfj_last_email',e.toLowerCase());localStorage.setItem('mfj_last_email',e.toLowerCase());document.getElementById('form-area').style.display='none';document.getElementById('success-wrap').classList.add('show');}catch(err){setMsg(err.message||'Unable to create account right now.','error');reset();}};
</script>
</body>
</html>
